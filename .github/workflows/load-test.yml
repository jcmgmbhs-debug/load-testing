name: Continuous Search Load Test
on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes
  workflow_dispatch:        # Manual trigger

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Run Load Test
      uses: grafana/k6-action@v0.3.0
      with:
        filename: search-test.js
